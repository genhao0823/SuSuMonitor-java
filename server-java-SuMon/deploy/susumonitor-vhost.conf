# SuSuMonitor 云端 Nginx 站点配置模板（IPv4）
#
# ⚠️ 安全警告（2026-08-29）：
#   以下 server 块为明文 HTTP-only 版本，仅限内网调试或明确知晓风险时临时使用。
#   该配置会以明文传输登录 JWT、Agent Token 与服务器 SSH 凭据，公网部署
#   必须改用下方注释的 HTTPS/WSS server 块（listen 443 ssl），并对 HTTP 强制 301 跳转。
#   本文件不应被任何公网生产环境原样启用。
#
# 适用场景：服务器仅 IPv4，无域名，使用明文 HTTP 80 端口临时访问。
# 反向代理到 127.0.0.1:18080 的 Java 后端。
#
# 重要：
# - 本配置只能与宝塔现有 nginx.conf 合并使用；不得覆盖整份配置。
# - HTTPS/WSS 必须在有域名并签发证书后才能启用（启用方式见文件底部注释块）。
# - /api/、/ws/agent、/ws/monitor 必须使用 proxy_http_version 1.1 并设置 Upgrade 头。

# ============ 明文 HTTP 版本（仅限临时/内网调试，公网生产禁用） ============
server {
    listen 80;
    server_name 82.156.245.102;

    root /www/wwwroot/susumonitor;
    index index.html;

    client_max_body_size 16m;

    # Agent installer and versioned releases.
    location /agent/ {
        try_files $uri =404;
        default_type application/octet-stream;
        add_header Cache-Control "no-store";
    }

    # 前端 SPA：fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 REST API 反代
    location /api/ {
        proxy_pass http://127.0.0.1:18080/api/;
        proxy_set_header Host 127.0.0.1:18080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent WebSocket
    location /ws/agent {
        proxy_pass http://127.0.0.1:18080/ws/agent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:18080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Monitor WebSocket
    location /ws/monitor {
        proxy_pass http://127.0.0.1:18080/ws/monitor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:18080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

