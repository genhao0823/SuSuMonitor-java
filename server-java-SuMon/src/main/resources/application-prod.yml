# 此配置只在 APP_ENV=prod 时生效，生产环境保留 INFO 日志以避免输出调试信息。
logging:
  level:
    com.susumonitor.server: INFO
    com.susumonitor.server.module.auth.mapper: INFO
    org.springframework.security: WARN
    org.mybatis: WARN

spring:
  # 明确当前文件仅属于 prod Profile，避免被其他 Profile 意外加载。
  config:
    activate:
      on-profile: prod
  # 由 Nginx 写入 X-Forwarded-* 请求头后，Spring 据此还原外部 HTTPS 请求信息。
  web:
    resources:
      add-mappings: false
  mvc:
    log-resolved-exception: false

server:
  # Nginx 是唯一公网入口，应用进程不得直接监听公网网卡。
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}
  forward-headers-strategy: framework

# 生产环境关闭 Swagger UI 与 OpenAPI 文档，避免向公网暴露全部接口结构与鉴权模型；
# 本地/测试 profile 不受影响（springdoc 默认开启）。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

susumonitor:
  agent:
    # 生产反代仅信任本机 Nginx，实际值必须在 root-only 环境文件中明确配置。
    trusted-proxy-cidrs: ${AGENT_TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
  terminal:
    # 生产环境默认每小时收口过期终端会话，可通过环境变量覆盖。
    cleanup-cron: ${TERMINAL_CLEANUP_CRON:0 0 * * * ?}
  cors:
    # 生产环境不得沿用本地开发源；部署时以实际 HTTPS 域名覆盖该变量。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://SERVER_IP_OR_DOMAIN}
