spring:
  application:
    name: ${APP_NAME:susumonitor}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${APP_ENV:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:susumonitor}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=${DB_TIMEZONE:Asia/Shanghai}&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:susumonitor}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: SuSuMonitorHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: ${ALERT_CONSUME_MAX_ATTEMPTS:3}
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:18080}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

susumonitor:
  jwt:
    secret: ${JWT_SECRET:}
    expire-hours: ${JWT_EXPIRE_HOURS:72}
  alert:
    notification-enabled: ${ALERT_NOTIFICATION_ENABLED:false}
    mail-from: ${ALERT_MAIL_FROM:noreply@susumonitor.local}
  security:
    aes-gcm-key: ${AES_GCM_KEY:}
  agent:
    register-key: ${AGENT_REGISTER_KEY:}
    max-connections: ${AGENT_MAX_CONNECTIONS:128}
    max-unauthenticated-connections: ${AGENT_MAX_UNAUTHENTICATED_CONNECTIONS:32}
    max-tracked-client-ips: ${AGENT_MAX_TRACKED_CLIENT_IPS:4096}
    handshake-rate-per-minute: ${AGENT_HANDSHAKE_RATE_PER_MINUTE:10}
    heartbeat-rate-per-minute: ${AGENT_HEARTBEAT_RATE_PER_MINUTE:12}
    heartbeat-burst: ${AGENT_HEARTBEAT_BURST:3}
    metrics-rate-per-minute: ${AGENT_METRICS_RATE_PER_MINUTE:24}
    metrics-burst: ${AGENT_METRICS_BURST:6}
    trusted-proxy-cidrs: ${AGENT_TRUSTED_PROXY_CIDRS:}
  ssh:
    connect-timeout-seconds: ${SSH_CONNECT_TIMEOUT_SECONDS:10}
    socket-timeout-seconds: ${SSH_SOCKET_TIMEOUT_SECONDS:15}
    total-timeout-seconds: ${SSH_TOTAL_TIMEOUT_SECONDS:30}
    max-concurrent-connections: ${SSH_MAX_CONCURRENT_CONNECTIONS:8}
    max-resolved-addresses: ${SSH_MAX_RESOLVED_ADDRESSES:8}
    allowed-ports: ${SSH_ALLOWED_PORTS:22}
    allowed-cidrs: ${SSH_ALLOWED_CIDRS:}
    idle-timeout-minutes: ${SSH_IDLE_TIMEOUT_MINUTES:20}
  metrics:
    retention-days: ${METRICS_RETENTION_DAYS:10}
    cleanup-cron: ${METRICS_CLEANUP_CRON:0 0 3 * * ?}
    cleanup-batch-size: ${METRICS_CLEANUP_BATCH_SIZE:1000}
    cleanup-max-batches-per-run: ${METRICS_CLEANUP_MAX_BATCHES_PER_RUN:100}
  terminal:
    cleanup-cron: ${TERMINAL_CLEANUP_CRON:0 0 * * * ?}
    max-sessions-per-user: ${TERMINAL_MAX_SESSIONS_PER_USER:2}
    max-sessions-per-server: ${TERMINAL_MAX_SESSIONS_PER_SERVER:4}
    max-operating-users: ${TERMINAL_MAX_OPERATING_USERS:5}
    max-sessions: ${TERMINAL_MAX_SESSIONS:16}
    idle-timeout-minutes: ${TERMINAL_IDLE_TIMEOUT_MINUTES:20}
    max-session-hours: ${TERMINAL_MAX_SESSION_HOURS:8}
    open-rate-per-minute: ${TERMINAL_OPEN_RATE_PER_MINUTE:6}
    open-burst: ${TERMINAL_OPEN_BURST:2}
    input-rate-per-minute: ${TERMINAL_INPUT_RATE_PER_MINUTE:600}
    input-burst: ${TERMINAL_INPUT_BURST:120}
    resize-rate-per-minute: ${TERMINAL_RESIZE_RATE_PER_MINUTE:60}
    resize-burst: ${TERMINAL_RESIZE_BURST:20}
    close-rate-per-minute: ${TERMINAL_CLOSE_RATE_PER_MINUTE:30}
    close-burst: ${TERMINAL_CLOSE_BURST:10}
    output-rate-bytes-per-second: ${TERMINAL_OUTPUT_RATE_BYTES_PER_SECOND:262144}
    output-burst-bytes: ${TERMINAL_OUTPUT_BURST_BYTES:524288}
    monitor-send-time-limit-millis: ${TERMINAL_MONITOR_SEND_TIME_LIMIT_MILLIS:5000}
    monitor-buffer-size-bytes: ${TERMINAL_MONITOR_BUFFER_SIZE_BYTES:262144}
  rabbitmq:
    enabled: ${OUTBOX_ENABLED:true}
    exchange: ${OUTBOX_EXCHANGE:susumonitor.events}
    routing-key: ${OUTBOX_ROUTING_KEY:metrics.reported.v1}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:200}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    publish-timeout-ms: ${OUTBOX_PUBLISH_TIMEOUT_MS:5000}
    max-backoff-seconds: ${OUTBOX_MAX_BACKOFF_SECONDS:300}
    outbox-cleanup-enabled: ${OUTBOX_CLEANUP_ENABLED:false}
    outbox-retention-days: ${OUTBOX_RETENTION_DAYS:30}
    outbox-cleanup-cron: ${OUTBOX_CLEANUP_CRON:0 30 3 * * ?}
    outbox-cleanup-batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:1000}
    outbox-cleanup-max-batches-per-run: ${OUTBOX_CLEANUP_MAX_BATCHES_PER_RUN:100}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Correlation-ID}
    max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
